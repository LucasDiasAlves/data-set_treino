version: '3.3'

services:
  metabase:
    image: metabase/metabase:latest
    container_name: metabase
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: h2
      MB_DB_FILE: /metabase-data/metabase.db
      MB_JETTY_PORT: 3000
    volumes:
      - ./metabase-data:/metabase-data
    restart: unless-stopped

# Definindo as redes que serão usadas pelos serviços.
    networks:
      - treino_bigdata # Nome da rede que será usada.

# Configuração das redes que serão usadas no docker-compose.
networks:
  treino_bigdata: # Nome da rede.
    external: # Indica que a rede é externa e já foi criada anteriormente.
      name: treino_bigdata # Nome da rede externa que será usada.
